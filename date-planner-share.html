<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ふたりのデートプラン | 共有ページ</title>
  <meta name="theme-color" content="#fbf4ef">
  <style>
    :root {
      --bg: #fbf4ef;
      --card: rgba(255, 252, 248, 0.96);
      --line: rgba(98, 74, 65, 0.12);
      --text: #342924;
      --muted: #7a6660;
      --accent: #c56f73;
      --accent-soft: #f6dddf;
      --shadow: 0 18px 40px rgba(91, 62, 49, 0.12);
      --radius: 28px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(197, 111, 115, 0.12), transparent 32%),
        linear-gradient(180deg, #fffaf7 0%, var(--bg) 100%);
    }

    .shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .gate {
      width: min(100%, 520px);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px;
    }

    .badge {
      display: inline-flex;
      padding: 7px 12px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
    }

    h1 {
      margin: 14px 0 0;
      font-size: clamp(30px, 7vw, 42px);
      line-height: 1.1;
    }

    p {
      margin: 12px 0 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .field {
      margin-top: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      color: var(--muted);
    }

    input {
      width: 100%;
      min-height: 48px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: #fff;
      padding: 0 14px;
      font-size: 15px;
    }

    button {
      margin-top: 14px;
      width: 100%;
      min-height: 50px;
      border: 0;
      border-radius: 16px;
      background: var(--accent);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .help, .error {
      font-size: 13px;
    }

    .help { margin-top: 12px; }
    .error { color: #b12f4c; margin-top: 10px; min-height: 20px; }

    .viewer {
      display: none;
      min-height: 100vh;
    }

    .viewer.open {
      display: block;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 252, 248, 0.94);
      backdrop-filter: blur(10px);
    }

    .topbar strong {
      font-size: 14px;
    }

    .topbar button {
      width: auto;
      min-height: 40px;
      margin-top: 0;
      padding: 0 14px;
      border-radius: 12px;
    }

    iframe {
      width: 100%;
      height: calc(100vh - 65px);
      border: 0;
      background: #fff;
    }
  </style>
</head>
<body>
  <section class="shell" id="gate">
    <div class="gate">
      <span class="badge">限定共有ページ</span>
      <h1>ふたりのデートプラン</h1>
      <p>このページは、共有された合言葉を入れると見られる形にしています。身内向けの軽い制限として使う前提です。</p>
      <div class="field">
        <label for="passphrase">合言葉</label>
        <input id="passphrase" type="password" placeholder="合言葉を入力">
      </div>
      <button id="unlock">ページを開く</button>
      <div class="error" id="error"></div>
      <p class="help">注記: これは軽い共有制限です。厳密な認証ではないので、本格的な非公開化にはサーバー側の認証が必要です。</p>
    </div>
  </section>

  <section class="viewer" id="viewer">
    <div class="topbar">
      <strong>ふたりのデートプラン</strong>
      <button id="lock">閉じる</button>
    </div>
    <iframe src="./date-planner-home-rich.html" title="デートプラン共有ページ"></iframe>
  </section>

  <script>
    const PASSPHRASE = "モコモコ";
    const gate = document.getElementById("gate");
    const viewer = document.getElementById("viewer");
    const passphrase = document.getElementById("passphrase");
    const unlock = document.getElementById("unlock");
    const lock = document.getElementById("lock");
    const error = document.getElementById("error");
    const sessionKey = "datePlannerShareUnlocked";

    function openViewer() {
      gate.style.display = "none";
      viewer.classList.add("open");
    }

    function closeViewer() {
      sessionStorage.removeItem(sessionKey);
      viewer.classList.remove("open");
      gate.style.display = "grid";
      passphrase.value = "";
      error.textContent = "";
    }

    if (sessionStorage.getItem(sessionKey) === "true") {
      openViewer();
    }

    unlock.addEventListener("click", () => {
      if (passphrase.value === PASSPHRASE) {
        sessionStorage.setItem(sessionKey, "true");
        openViewer();
      } else {
        error.textContent = "合言葉が違います。";
      }
    });

    passphrase.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        unlock.click();
      }
    });

    lock.addEventListener("click", closeViewer);
  </script>
</body>
</html>
